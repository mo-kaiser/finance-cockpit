<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow, noarchive" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
		<style>
			/* Ladehinweis beim ersten Aufruf, bis die Seite ihre Daten hat (entfernt in +layout.svelte) */
			#boot-loader {
				position: fixed; right: 16px; bottom: 16px; z-index: 100; display: flex; align-items: center; gap: 10px;
				max-width: min(420px, calc(100vw - 32px)); padding: 10px 14px; border-radius: 14px;
				font: 14px/1.4 system-ui, sans-serif; background: #fff; color: #181c19; border: 1px solid #e1e4dd;
				box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
			}
			#boot-loader i {
				width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid #e3f3ea; border-top-color: #1f6f4a;
				animation: boot-spin 0.8s linear infinite;
			}
			@keyframes boot-spin { to { transform: rotate(360deg); } }
			@media (prefers-color-scheme: dark) {
				#boot-loader { background: #1a201c; color: #eef3ef; border-color: #2c352f; }
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot-loader" role="status"><i aria-hidden="true"></i><span>Lade Daten …</span></div>
		<script>
			setTimeout(function () {
				var el = document.querySelector('#boot-loader span');
				if (el) el.textContent = 'Dauert länger als üblich – Bitget oder die Datenbank antworten langsam, die Seite arbeitet noch.';
			}, 10000);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
